<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Backstube Angerer</title>

  <!-- PWA Einstellungen -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#963816">

  <!-- Apple iOS Einstellungen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Angerer">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #963816;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe id="appFrame" src="https://script.google.com/macros/s/AKfycbzAoiCpS5L7IO-S1H74Qat78ka0cWf75F2r24AfWpEyDMULP4Uap1CPls8ze8GF_LJZww/exec"></iframe>

  <script>
    // Dauerhafte Speicherung auf iPhone & Android
    window.addEventListener('message', function(e) {
      if (!e.data || !e.data.action) return;
      if (e.data.action === 'save_auth') {
        if (e.data.remember === '1') {
          localStorage.setItem('angerer_emp', e.data.empId);
          localStorage.setItem('angerer_pin', e.data.pin);
          localStorage.setItem('angerer_rem', '1');
        } else {
          localStorage.removeItem('angerer_emp');
          localStorage.removeItem('angerer_pin');
          localStorage.setItem('angerer_rem', '0');
        }
      } else if (e.data.action === 'clear_auth') {
        localStorage.removeItem('angerer_emp');
        localStorage.removeItem('angerer_pin');
        localStorage.setItem('angerer_rem', '0');
      } else if (e.data.action === 'get_auth') {
        var emp = localStorage.getItem('angerer_emp') || '';
        var pin = localStorage.getItem('angerer_pin') || '';
        var rem = localStorage.getItem('angerer_rem') || '';
        if (e.source) {
          e.source.postMessage({
            action: 'auth_data',
            empId: emp,
            pin: pin,
            remember: rem
          }, '*');
        }
      }
    });
  </script>
</body>
</html>
